# Ontology 第一期 — 校验规则
# 来源: 20-亚马逊广告Ontology补充.md §9, 22-Ontology第一期补充内容清单.md §7
# 版本: phase_1 + phase_1b（GROUP-* 见 budget_groups.yaml）

version: v3.4.0
description: >
  Agent 输出前 ontology 合法性校验规则；预算组合算术规则见 budget_groups.yaml。
  本文件由 app/core/ontology_validator.py 实际执行。

severity_levels:
  hard_block: 必须阻断或放入 blocked_actions，不得作为 proposed_actions 输出
  review_required: 可输出但须标记 ontology_validation_status=review_required
  downgraded: 动作降级为观察或替代方向

validation_rules:
  ONT-001:
    name: search_term_no_direct_bid
    rule: SearchTerm 不能直接调 Bid
    if:
      object_class: SearchTerm
      action_code:
        in:
          - bid_up_for_ranking
          - bid_down_for_acos
    then:
      status: blocked
      allowed_alternatives:
        - add_negative_search_term
        - promote_search_term_to_keyword
    severity: hard_block

  ONT-002:
    name: broad_phrase_auto_no_placement
    rule: broad / phrase / auto 广告不能做 Placement 调整
    if:
      campaign_type:
        in:
          - broad_keyword
          - phrase_keyword
          - auto_discovery
      action_code: placement_adjustment
    then:
      status: blocked
      placement_adjustment: N/A
    severity: hard_block

  ONT-003:
    name: ad_purpose_allowed_values
    rule: ad_purpose 只能是 traffic / conversion / ranking / profit
    if:
      field: ad_purpose
      value:
        in:
          - maintain
          - balance_maintain
    then:
      status: blocked
      message: balance_maintain 是广告方向，不是广告目的
    allowed_values:
      - traffic
      - conversion
      - ranking
      - profit
    severity: hard_block

  ONT-003b:
    name: ranking_missing_organic_rank_signal
    rule: 精准 Ranking 缺自然排名数据时阻断 push_natural_rank
    if:
      campaign_type: exact_keyword
      ad_purpose: ranking
      signal_missing: organic_rank_signal
      ad_direction: push_natural_rank
    then:
      status: blocked
      suggest_direction:
        - conversion
        - balance_maintain
    severity: hard_block
    note: 与 20 §9 ONT-003 场景规则合并编号为 ONT-003b，避免与取值校验 ONT-003 混淆

  ONT-004:
    name: missing_inventory_blocks_growth
    rule: 缺库存数据时，阻断所有增长型动作
    if:
      signal_missing: inventory_status
      action_code:
        in_growth_actions: true
    then:
      status: blocked
      non_growth_actions: mark_data_quality_risk
    severity: hard_block
    references:
      growth_actions_file: actions.yaml

  ONT-005:
    name: missing_placement_report_scope
    rule: 缺 Placement 数据时，只阻断 Placement 调整，不阻断 Bid / Budget / 否词
    if:
      signal_missing: placement_report
      action_code: placement_adjustment
    then:
      status: blocked
    if_else:
      signal_missing: placement_report
      action_code:
        not_in:
          - placement_adjustment
    then:
      status: allowed_with_note
      note: 非广告位动作不受影响
    severity: hard_block

  ONT-006:
    name: ranking_action_requires_organic_rank
    rule: Ranking 动作缺自然排名数据时，阻断 push_natural_rank 及相关 bid_up_for_ranking
    if:
      ad_direction: push_natural_rank
      signal_missing: organic_rank_signal
    then:
      status: blocked
    if:
      action_code: bid_up_for_ranking
      ad_purpose: ranking
      signal_missing: organic_rank_signal
    then:
      status: blocked
    if:
      signal_present: product_type_definition
      listing_required_attributes_missing: true
      cvr_below_category_mean: true
    then:
      status: downgraded
      prefer: listing_diagnosis_over_aggressive_expansion
    severity: hard_block

  ONT-007:
    name: no_fake_balance_maintain_on_missing_data
    rule: 数据缺失不能输出 balance_maintain_no_action 伪装成健康维持
    if:
      action_code: balance_maintain_no_action
      critical_data_missing: true
    then:
      status: review_required
      message: 不得将数据缺失误判为健康维持
    if:
      signal_missing: browse_node_context
    then:
      status: downgraded
      fallback: account_mean_conservative
      audit_level: elevated
    severity: review_required

  ONT-008:
    name: balance_maintain_is_direction_not_purpose
    rule: ad_direction=balance_maintain 不得推导为 ad_purpose=maintain
    if:
      ad_direction: balance_maintain
      inferred_ad_purpose: maintain
    then:
      status: blocked
      keep_ad_purpose_in:
        - traffic
        - conversion
        - ranking
        - profit
    severity: hard_block

  ONT-009:
    name: auto_target_promote_before_bid_up
    rule: 自动投放跑出有效 SearchTerm 时优先提词而非持续提高 Auto Bid
    if:
      object_class: AutoTarget
      evidence: effective_search_term_from_auto
      suggested_action: bid_up_for_ranking
    then:
      status: downgraded
      prefer_action: promote_search_term_to_keyword
      prefer_match_type:
        - EXACT
        - long_tail
    severity: downgraded

  ONT-010:
    name: product_target_pp_better_than_tos_ros
    rule: ProductTarget 的 PP 表现优于 TOS/RoS 时允许 PP 方向加价，仍需通过护栏
    if:
      campaign_type: product_targeting
      placement_signal: pp_outperforms_tos_ros
      action_code: placement_adjustment
      placement: product_pages
    then:
      status: passed_with_guardrails
    required_pass:
      - inventory_status
      - listing_quality_signal
      - budget_guardrail
    severity: hard_block

  # ---------------------------------------------------------------------------
  # Phase 1b — 广告组合对象边界规则（来源 20 §9 ONT-011~014）
  # 这 4 条是对象级硬约束，与 GROUP-* 预算算术校验不同：
  #   ONT-011/012 约束对象身份混用，ONT-013/014 约束淘汰动作目标与低价捡漏组不变属性
  # ---------------------------------------------------------------------------
  ONT-011:
    name: portfolio_not_equal_ad_budget_group
    rule: Portfolio 是广告组织对象（账号侧容器），不等于 AdBudgetGroup（预算控制层）；二者不得混用
    if:
      object_class: Portfolio
      usage:
        in:
          - budget_control
          - group_budget_reallocation
          - eliminated_campaign_release
    then:
      status: blocked
      message: Portfolio 仅用于组织 Campaign，预算控制必须使用 AdBudgetGroup
      correct_object: AdBudgetGroup
    severity: hard_block
    maps_to:
      - entities.yaml:94-100     # Portfolio 定义
      - entities.yaml:102-124    # AdBudgetGroup 定义
      - budget_groups.yaml:8-9   # Portfolio ≠ AdBudgetGroup 注释

  ONT-012:
    name: campaign_must_belong_to_exactly_one_budget_group
    rule: 每个 Campaign 必须且只能归属 1 个 AdBudgetGroup
    if:
      object_class: Campaign
      any_of:
        - belongs_to_group_missing: true
        - belongs_to_group_count: "> 1"
    then:
      status: blocked
      message: Campaign 必须归属唯一一个 AdBudgetGroup，缺失或多归属均阻断输出
    severity: hard_block
    maps_to:
      - budget_groups.yaml:55      # Campaign.belongs_to_group
      - 23-广告组合与预算分配规则.md §3.2  # 归类优先级（冲突时只能落一个组）

  ONT-013:
    name: eliminate_target_must_be_low_bid_retention_group
    rule: eliminate_to_low_bid_pool 动作的目标组合必须是 low_bid_retention_group（低价捡漏组）
    if:
      action_code: eliminate_to_low_bid_pool
      target_group_type:
        not_in:
          - low_bid_retention_group
    then:
      status: blocked
      message: 淘汰动作只能移入低价捡漏组（low_bid_retention_group），不得移入精准主力组/精准测试组/广泛自动组
    severity: hard_block
    maps_to:
      - 23-广告组合与预算分配规则.md §3.2  # 优先级：低价捡漏组 > 广泛自动组 > 精准主力组 > 精准测试组
      - 23-广告组合与预算分配规则.md §8.4  # 低价捡漏组动作规则
      - 21-淘汰广告活动规则.md:L14           # 淘汰统一使用 eliminate_to_low_bid_pool

  ONT-014:
    name: low_bid_retention_group_immutable_properties
    rule: >
      低价捡漏组的组合预算固定 $1；Target Bid 为 min(current_bid, 0.20)；不参与增长预算分配。
      这些属性不可被任何动作覆盖。
    if:
      object_class: AdBudgetGroup
      group_type: low_bid_retention_group
      any_of:
        - proposed_group_budget: "!= 1"
        - proposed_bid: "> min(current_bid, 0.20)"
        - participates_in_increase_allocation: true
    then:
      status: blocked
      message: 低价捡漏组预算锁死 $1、Bid 不得高于 min(current_bid, 0.20)，不可参与新增或二次分配接收
    bid_rule_note: |
      遇到本来 Bid = $0.15 的词，转组时不得被强行抬到 $0.20 —— 等于给一个正在淘汰的词加价 33%。
      同时 $0.20 不得被误当作全站 Bid 硬下限，阻断所有低于 $0.20 的合法策略
      （女装长尾里 $0.10–0.18 的 Bid 是常见的）。
      三概念分离见 03号§8.1：全站上限 $3.00 / 全站下限 $0.02（US）/ 低价捡漏组 min(current_bid, 0.20)。
    severity: hard_block
    note: 本规则与 GROUP-004/004A 共同构成低价捡漏组双层防线；ONT-014 属对象层不可变属性校验，GROUP-004/004A 属预算层算术校验
    maps_to:
      - 20-亚马逊广告Ontology补充.md §9 ONT-014
      - budget_groups.yaml:87-96  # low_bid_retention_group budget_trait
      - 23-广告组合与预算分配规则.md §8.4

  ONT-015:
    name: exact_campaign_forbids_negative_action
    rule: 精准广告不得生成否词动作
    if:
      campaign_match_type: EXACT
      action_code: add_negative_search_term
    then:
      status: blocked
      message: 精准广告只能调整 Target Bid、Campaign 预算/广告位、迁组或关闭，不执行否词
      recommended_next_step:
        - split_campaign_by_match_type
        - manual_campaign_level_negative_in_console
      note: >
        只 block 不给替代路径，运营看到一个没有下一步的空动作，
        会绕过系统直接在后台改，反而失去可观测性。
        Amazon 的 EXACT 匹配实际会匹配近义变体（复数、拼写、词序），多关键词 EXACT
        活动更会真实交叉抢量，这些场景运营确实需要处理手段。
    severity: hard_block

  ONT-016:
    name: non_exact_cannot_enter_low_bid_retention
    rule: 广泛、词组、自动、商品定投活动退出时使用 stop_campaign，不得进入低价捡漏组
    if:
      campaign_match_type:
        in: [BROAD, PHRASE, AUTO, PRODUCT_TARGETING]
      target_group_type: low_bid_retention_group
    then:
      status: blocked
      message: 非精准活动禁止迁入低价捡漏组
      required_exit_action: stop_campaign
      note: >
        低价捡漏组的语义是「保留一个已验证精准词的低成本存在感」。
        商品定投没有关键词、捡不到漏，$0.20 的 Bid 在 ASIN 定投上基本不会有曝光，留着只是账面噪声。
    severity: hard_block

  ONT-018:
    name: keyword_fidelity
    rule: 所有候选词必须存在于本轮输入数据，禁止生成输入外的词（词保真，见 25号§4）
    if:
      any_of:
        - keyword_not_in_input_data: true
        - word_root_not_extractable_from_actual_search_terms: true
    then:
      status: blocked
      reason_codes: [KEYWORD_NOT_IN_INPUT, WORD_ROOT_FABRICATED]
      message: 候选词不在本轮输入数据中，或词根无法从实际搜索词提取
    severity: hard_block
    note: 词保真校验；候选词必须存在于本轮输入数据。
    maps_to:
      - 执行规则/25-目标ACOS预算Bid推荐.md §4
      - 执行规则/28-新增词来源相关性与场景化配额规则.md §1

  ONT-019:
    name: keyword_source_and_relevance_admission
    rule: 扩词候选必须标注来源码与相关性档位；R4 禁止扩词；高风险来源强制人工
    if:
      action_code:
        in: [expand_keywords, create_campaign, promote_search_term_to_keyword]
      any_of:
        - keyword_source_missing: true
        - relevance_tier_missing: true
        - relevance_tier: R4
    then:
      status: blocked
      reason_codes: [KEYWORD_SOURCE_MISSING, RELEVANCE_TIER_MISSING, RELEVANCE_TOO_LOW]
    if_high_risk_source:
      keyword_source:
        in: [SRC_COMPETITOR_ASIN, SRC_BRAND_CATEGORY]
      then:
        status: review_required
        review_level: HIGH_RISK_REVIEW
    severity: hard_block
    maps_to:
      - 执行规则/28-新增词来源相关性与场景化配额规则.md §1 / §2 / §4

  ONT-020:
    name: action_code_must_be_registered
    rule: action_code 必须在 30-动作词表与映射.md §1 注册，且与 physical_action_code / scope / campaign_type 匹配
    if:
      any_of:
        - action_code_not_in_registry: true
        - action_code_physical_code_mismatch: true
        - action_code_scope_mismatch: true
        - action_code_not_allowed_for_campaign_type: true
    then:
      status: blocked
      reason_codes: [ACTION_NOT_REGISTERED, ACTION_CODE_MISMATCH, ACTION_SCOPE_INVALID]
    severity: hard_block
    maps_to:
      - 30-动作词表与映射.md §1 / §7
      - ontology/campaign_types.yaml allowed_actions / forbidden_actions

  ONT-021:
    name: stage_expired_testing_freezes_growth
    rule: product_stage=testing 且已满最长测试天数时，冻结增长型动作并将阶段 ACOS 加值归零
    if:
      product_stage: testing
      stage_days_elapsed: ">= 03号§2 最长测试天数"
      action_code:
        in_growth_actions: true
    then:
      status: blocked
      reason_code: STAGE_EXPIRED_TESTING
      required_output: manual_review_stage_confirmation
      stage_acos_addon_override: 0
    severity: hard_block
    note: >
      testing 超期同时享受最高 ACOS 容忍加值（+15%）、×0.5 幅度抑制、以及免淘汰评估
      三项优待——一个卡在 testing 不动的产品会变成永不被优化的黑洞。
      Agent 不得自行改产品阶段标签（02号§2 权限为「仅建议」），故只能冻结 + 逼出人工确认。
    maps_to:
      - 03-阈值参数.md §2
      - 执行规则/15-策略约束值规则.md §4.2
      - 执行规则/17-问题诊断与动作优先级.md §1.2

  ONT-022:
    name: irreversible_action_requires_mature_data
    rule: 不可逆动作（淘汰/关闭/否词/降组/升组）要求决策窗口最新数据龄 ≥ 03号§12.2 的最小龄
    if:
      action_code:
        in: [eliminate_to_low_bid_pool, stop_campaign, add_negative_search_term,
             demote_to_exact_testing, promote_to_exact_core]
      any_of:
        - data_min_age_days: "< 03号§12.2 最小龄"
        - data_min_age_days: missing
    then:
      status: blocked
      blocked_when: data_min_age_days_below_minimum
      blocked_when_missing: data_min_age_days_missing
      reason_codes: [DATA_NOT_MATURE, DATA_AGE_UNKNOWN]
      recommended_next_step:
        - Agent 自动延后；下轮读取配置的成熟窗口后重新判断
    exemption:
      - action_code: add_negative_search_term
        when: relevance_tier in [R3, R4]
        why: 相关性驱动的否词是语义判定（31号§4 档4 无数据门槛），不依赖表现数据成熟度
      - action_code: [eliminate_to_low_bid_pool, stop_campaign]
        when: operating_mode == immediate_exit
        why: 立即退出由人工前置标签授权；仅豁免成熟度门，仍保留其他 Ontology 与最终执行确认
    severity: hard_block
    note: >
      Amazon 7 天点击归因使 T+1 数据系统性低报销售，
      未成熟窗口上的不可逆动作是方向一致的持续性错误。
    maps_to:
      - 03-阈值参数.md §12

  ONT-017:
    name: mixed_match_campaign_requires_split
    rule: 同一Campaign混有精准与非精准Target时无法归入单一组合
    if:
      campaign_contains_exact_and_non_exact_targets: true
    then:
      status: blocked
      recommended_action: split_campaign_by_match_type
      message: 按匹配类型拆分活动后重新分析
    severity: hard_block

# ---------------------------------------------------------------------------
# 广告组合与预算分配（Phase 1b，来源 23-广告组合与预算分配规则.md）
# ---------------------------------------------------------------------------
group_validation_rules:
  GROUP-001:
    name: campaign_must_belong_to_budget_group
    rule: 每个 Campaign 必须归属一个 AdBudgetGroup
    if:
      field: belongs_to_group
      missing: true
    then:
      status: review_required
      action: MANUAL_REVIEW
    severity: review_required
    detail_file: budget_groups.yaml

  GROUP-002:
    name: recalculate_group_after_campaign_budget
    rule: Campaign 预算调整后必须回算所属组合预算
    if:
      action_applied:
        in:
          - campaign_budget_increase
          - campaign_budget_decrease
          - eliminate_to_low_bid_pool
      portfolio_budget_summary_present: false
    then:
      status: blocked
      message: 未回算组合预算则不得输出
    severity: hard_block
    maps_to_principle: GROUP-BUDGET-001

  GROUP-003:
    name: recalculate_parent_after_group_budget
    rule: 组合预算调整后必须回算父 ASIN 总预算
    if:
      group_budget_recalculated: true
      parent_budget_recalculated: false
    then:
      status: blocked
    severity: hard_block
    maps_to_principle: GROUP-BUDGET-002

  GROUP-004:
    name: low_bid_retention_group_no_increase_allocation
    rule: 低价捡漏组不得参与新增预算分配
    if:
      group_type: low_bid_retention_group
      group_requested_positive_delta: "> 0"
    then:
      status: blocked
    severity: hard_block
    maps_to_principle: GROUP-BUDGET-005

  GROUP-004A:
    name: low_bid_retention_group_fixed_budget_and_bid
    rule: 低价捡漏组组合预算必须固定 $1，Bid 必须固定 $0.20
    if:
      group_type: low_bid_retention_group
      any_of:
        - proposed_group_budget: "!= 1"
        - proposed_bid: "!= 0.20"
    then:
      status: blocked
    severity: hard_block

  GROUP-005:
    name: exact_core_group_no_starvation
    rule: 精准主力组不得因精准测试组或广泛自动组扩张而断供
    if:
      exact_core_group_protected: true
      testing_or_auto_increase: true
      exact_core_group_decreased: true
    then:
      status: review_required
      alt_status: blocked
    severity: hard_block
    maps_to_principle: GROUP-BUDGET-004
    detail_ref: group_budget_004

  GROUP-006:
    name: compress_when_parent_net_increase_disallowed
    rule: 父 ASIN 不允许净增预算时，所有正向增量必须按请求比例或经营目标动态压缩
    if:
      parent_net_increase_allowed: false
      positive_deltas_uncompressed: true
    then:
      status: review_required
    severity: review_required

  GROUP-010:
    name: group_overallocation_two_tier
    rule: >
      组合超配（活动预算总和 / 组合预算）超过 2.0 倍时分两级处理：
      本轮动作导致跨越 → 硬阻断；存量已超 → MANUAL_REVIEW 且本轮只允许降预算动作。
    if_crossing:
      overallocation_ratio_before: "<= 2.0"
      overallocation_ratio_after: "> 2.0"
    then:
      status: blocked
      reason_code: OVERALLOCATION_CROSSED_BY_THIS_ROUND
      message: 本轮动作会使活动预算总和超过组合预算 2 倍，阻断
    if_pre_existing:
      overallocation_ratio_before: "> 2.0"
    then:
      status: review_required
      review_level: MANUAL_REVIEW
      allowed_actions_this_round: [campaign_budget_decrease, portfolio_budget_adjust]
      message: 组合存量超配已超 2 倍，本轮只允许降预算或提升组合预算
    severity: hard_block
    note: >
      分两级处理：Agent 造成的越界必拦（BLOCKED），历史遗留的超配交人工但限制动作方向
      （只允许降预算）——统一硬阻断会让历史已超配的组合陷入死锁；统一 MANUAL_REVIEW
      会让预算失控的唯一防线变成人工，而这类提案很多、容易被批量点过。
    maps_to:
      - 执行规则/23-广告组合与预算分配规则.md §4.3
      - 10-安全护栏.md §1.9

  GROUP-011:
    name: exact_push_share_scale_threshold
    rule: >
      max_exact_push_share 未设置时，仅当本轮给精准主力组的加预算额 > 本轮可分配预算 × 50%
      才要求该字段（否则 MANUAL_REVIEW）；未达此规模按动态分配正常执行。
    if:
      max_exact_push_share_configured: false
      exact_core_increase_amount: "> available_reallocation_budget * 0.5"
    then:
      status: review_required
      review_level: MANUAL_REVIEW
      message: 未设置精准推进占比上限且本轮推词加预算超过可分配预算 50%，需人工确认
    else:
      status: allowed_with_note
      required_field: exact_push_share_note
    severity: review_required
    note: >
      该字段可选、实际大概率没人填 —— 如果未设置即一律 MANUAL_REVIEW，所有
      active_promotion 的预算动作会全部堆到人工，运营必然批量点过，
      护栏形式上存在、实质上失效。故仅超出规模阈值时才要求人工确认。
    maps_to:
      - 执行规则/23-广告组合与预算分配规则.md §7.2

  GROUP-007:
    name: surplus_release_not_forced_allocated
    rule: 释放预算大于新增需求时，不得强行分配完，多余部分进入预算缓冲
    if:
      released_budget: "> net_required_increase"
      forced_full_allocation: true
    then:
      status: review_required
    severity: review_required

