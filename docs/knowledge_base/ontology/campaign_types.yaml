# Ontology 第一期 — Campaign Type 动作合法性
# 来源: 20-亚马逊广告Ontology补充.md §4, 22-Ontology第一期补充内容清单.md §3
# 版本: phase_1

version: v3.4.0
description: 各 Campaign Type 允许/禁止动作、目标类型、所需报表
# 修正记录：
#  1) broad/phrase/auto 的 allowed_actions 曾含 eliminate_to_low_bid_pool，
#     与 ONT-016 / ONT-RUNTIME-002 / budget_groups.classification_rules / 21号 / 05号§7 全部冲突。
#     actions.yaml 侧本来就是对的（forbidden: campaign_match_type_not_exact），本文件是唯一错误源。
#     已改为 stop_campaign。
#  2) exact_keyword 的 forbidden_actions 曾写 mass_negative_keywords（只禁「批量」否词），
#     给「少量否词」开了口子，与 ONT-015 / ONT-RUNTIME-005「精准完全禁止否词」冲突。
#     已改为 add_negative_search_term 全禁，并补 recommended_next_step。
# 动作码以 docs/knowledge_base/30-动作词表与映射.md §1 为唯一权威。

campaign_types:
  exact_keyword:
    label_zh: 精准关键词广告
    source: 手动关键词投放
    object_class: Campaign
    allowed_targets:
      - KeywordTarget
    target_constraints:
      match_type: EXACT
    primary_use: 承接已验证词、推自然位、稳定转化
    allowed_actions:
      - bid_up_for_ranking
      - bid_down_for_acos
      - campaign_budget_increase
      - campaign_budget_decrease
      - placement_adjustment              # TOS 上限按 03号§6.2 产品定位四档
      - eliminate_to_low_bid_pool         # 仅 EXACT 可用
      - demote_to_exact_testing           # 主力组中度回落（32号§2.3）
      - promote_to_exact_core             # 测试组升组（23号§3.5）
      - create_campaign                   # 新建单关键词精准活动（16号）
      - enable_campaign
      - reactivate_budget_only            # 21号§7 情况一
      - reactivate_with_calibrated_bid    # 21号§7 情况二
      - balance_maintain_no_action
    forbidden_actions:
      - add_negative_search_term          # 全禁，不只是批量。ONT-015 / ONT-RUNTIME-005
      - blind_broad_expansion
      - expand_keywords                   # 单关键词精准活动扩词会变成多关键词 → ROUTE-002 直接进低价捡漏组
      - stop_campaign                    # EXACT 的退出动作是 eliminate_to_low_bid_pool（ONT-016）
    forbidden_action_alternatives:
      add_negative_search_term:
        status: blocked
        recommended_next_step:
          - split_campaign_by_match_type
          - manual_campaign_level_negative_in_console
        note: >
          只 block 不给替代路径，运营看到一个没有下一步的空动作，
          会绕过系统直接在后台改，反而失去可观测性。对比 ONT-001 是给了
          allowed_alternatives 的。
    required_reports:
      - targeting_report
      - placement_report
      - inventory_status
      - organic_rank_signal
    validation_rule_refs:
      - ONT-003
      - ONT-005
      - ONT-006

  phrase_keyword:
    label_zh: 词组关键词广告
    source: 手动关键词投放
    object_class: Campaign
    allowed_targets:
      - KeywordTarget
    target_constraints:
      match_type: PHRASE
    primary_use: 中等范围扩词和搜索词沉淀
    allowed_actions:
      - bid_up_for_ranking
      - bid_down_for_acos
      - campaign_budget_increase
      - campaign_budget_decrease
      - add_negative_search_term
      - promote_search_term_to_keyword
      - expand_keywords                   # 补齐（28号 是其决策层）
      - create_campaign                   # 新建广泛/词组测词活动（16号）
      - stop_campaign                    # 退出动作，取代 eliminate_to_low_bid_pool
      - balance_maintain_no_action
    forbidden_actions:
      - placement_adjustment
      - eliminate_to_low_bid_pool         # ONT-016：非精准禁入低价捡漏组
    required_reports:
      - search_term_report
      - targeting_report
      - inventory_status
    validation_rule_refs:
      - ONT-002
      - ONT-016

  broad_keyword:
    label_zh: 广泛关键词广告
    source: 手动关键词投放
    object_class: Campaign
    allowed_targets:
      - KeywordTarget
    target_constraints:
      match_type: BROAD
    primary_use: 打开词池、获取搜索词样本
    allowed_actions:
      - bid_up_for_ranking
      - bid_down_for_acos
      - campaign_budget_increase
      - campaign_budget_decrease
      - add_negative_search_term
      - promote_search_term_to_keyword
      - expand_keywords                   # 补齐（28号 是其决策层）
      - create_campaign                   # 新建广泛/词组测词活动（16号）
      - stop_campaign                    # 退出动作，取代 eliminate_to_low_bid_pool
      - balance_maintain_no_action
    forbidden_actions:
      - placement_adjustment
      - eliminate_to_low_bid_pool         # ONT-016：非精准禁入低价捡漏组
    required_reports:
      - search_term_report
      - targeting_report
      - inventory_status
    validation_rule_refs:
      - ONT-002
      - ONT-016

  auto_discovery:
    label_zh: 自动广告
    source: 自动投放
    object_class: Campaign
    allowed_targets:
      - AutoTarget
    primary_use: 发现关键词、商品和类目机会
    allowed_actions:
      - bid_down_for_acos
      - campaign_budget_increase
      - campaign_budget_decrease
      - add_negative_search_term
      - promote_search_term_to_keyword
      - expand_keywords                   # 补齐（28号 是其决策层）
      - create_campaign                   # 新建广泛/词组测词活动（16号）
      - stop_campaign                    # 退出动作，取代 eliminate_to_low_bid_pool
      - balance_maintain_no_action
    forbidden_actions:
      - placement_adjustment
      - eliminate_to_low_bid_pool         # ONT-016：非精准禁入低价捡漏组
      - auto_target_bid_adjustment        # AUTO Target 契约未完成前阻断（ONT-009 / 31号§8）
    required_reports:
      - search_term_report
      - targeting_report
      - inventory_status
    validation_rule_refs:
      - ONT-002
      - ONT-009
      - ONT-016

  product_targeting:
    label_zh: 商品/类目投放广告
    source: 手动商品/类目投放
    object_class: Campaign
    allowed_targets:
      - ProductTarget
    primary_use: 竞品截流、类目拓展、防守自家页面
    allowed_actions:
      - bid_up_for_ranking
      - bid_down_for_acos
      - campaign_budget_increase
      - campaign_budget_decrease
      - placement_adjustment              # PP 优先，ONT-010
      - expand_keywords                   # 扩 ASIN / 类目 Target（非关键词）
      - create_campaign                   # 竞品截流窗口触发时新建（16号§1）
      - stop_campaign                    # 退出动作
      - balance_maintain_no_action
    forbidden_actions:
      - keyword_match_type_adjustment
      - add_negative_search_term          # 无搜索词，不做否词
      - eliminate_to_low_bid_pool         # ONT-016：不进低价捡漏组
    portfolio_group: auto_broad_group          # 收回为子桶
    portfolio_subtype: product_targeting       # 子桶身份（广告位权限按子桶放开）
    exact_main_validation_applicable: false
    required_reports:
      - targeting_report
      - placement_report
      - inventory_status
      - listing_quality_signal
    validation_rule_refs:
      - ONT-005
      - ONT-010

# 跨类型汇总
placement_forbidden_types:          # 禁止广告位调整
  - broad_keyword
  - phrase_keyword
  - auto_discovery
placement_allowed_types:            # 允许广告位调整
  - exact_keyword                   # TOS 上限按 03号§6.2 定位四档
  - product_targeting               # PP 优先，ONT-010
validation_rule_ref: ONT-002

low_bid_retention_eligible_types:   # 唯一可进低价捡漏组的类型（ONT-016）
  - exact_keyword
stop_campaign_exit_types:          # 退出走 stop_campaign 的类型（ONT-RUNTIME-007）
  - broad_keyword
  - phrase_keyword
  - auto_discovery
  - product_targeting

# campaign_type → 组合归属（与 budget_groups.yaml 一致）
portfolio_mapping:
  exact_keyword: [exact_core_group, exact_testing_group, low_bid_retention_group]
  broad_keyword: [auto_broad_group]
  phrase_keyword: [auto_broad_group]
  auto_discovery: [auto_broad_group]
  product_targeting: [auto_broad_group]      # 子桶归属父组
