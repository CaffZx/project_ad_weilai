<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Campaign 活动分析 — 调试</title>
<style>
:root {
  --bg: #F9FAFB;
  --card-bg: #FFFFFF;
  --border: #E5E7EB;
  --foreground: #111827;
  --muted-fg: #6B7280;
  --primary: #4F46E5;
  --primary-hover: #4338CA;
  --primary-light: #EEF2FF;
  --radius-card: 8px;
  --transition-ctl: .15s ease;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--foreground); font-size: 13px; line-height: 1.5;
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: rgba(255,255,255,0.95);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
}
.topbar-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.topbar-badge { font-size: 10px; background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 9999px; font-weight: 600; }
.topbar-status { font-size: 12px; color: var(--muted-fg); display: flex; align-items: center; gap: 6px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #9CA3AF; }
.status-dot.online { background: #22C55E; }

.app-layout { display: flex; height: calc(100vh - 46px); }
.sidebar {
  width: 360px; min-width: 360px; overflow-y: auto;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
  border-right: 1px solid var(--border);
}
.main-area { flex: 1; overflow-y: auto; padding: 16px; }

.card {
  background: var(--card-bg); border-radius: var(--radius-card);
  border: 1px solid var(--border); padding: 12px 14px;
}
.card-title { font-size: 12px; font-weight: 600; color: var(--muted-fg); margin-bottom: 8px; }

label { display: block; font-size: 11px; color: var(--muted-fg); margin-bottom: 4px; }
input, select {
  width: 100%; padding: 6px 8px; font-size: 13px;
  border: 1px solid var(--border); border-radius: 6px; background: white;
}
input:focus, select:focus { outline: none; border-color: var(--primary); }

.btn {
  display: inline-block; padding: 7px 14px; font-size: 12px; font-weight: 500;
  border-radius: 6px; border: 1px solid transparent; cursor: pointer;
  transition: all var(--transition-ctl); text-align: center;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-primary:disabled { background: #9CA3AF; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--muted-fg); border-color: var(--border); }
.btn-ghost:hover { background: #F3F4F6; }
.btn-block { display: block; width: 100%; }

.kv { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 4px 0; }
.kv .k { color: var(--muted-fg); }
.kv .v { font-weight: 500; }
.kv .v.empty { color: #9CA3AF; font-style: italic; font-weight: 400; }

.muted { color: var(--muted-fg); }
.text-xs { font-size: 11px; }
.text-sm { font-size: 12px; }
.hidden { display: none !important; }

.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Campaign 分析专属 ─── */
.disclaimer {
  font-size: 11px; color: #78350F; padding: 8px 12px;
  background: #FEF3C7; border-left: 3px solid #F59E0B; margin-bottom: 12px;
  border-radius: 0 4px 4px 0;
}
.campaign-summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  margin-bottom: 8px;
}
.campaign-summary .stat { text-align: center; }
.campaign-summary .num  { font-size: 22px; font-weight: 700; }
.campaign-summary .lab  { font-size: 11px; color: var(--muted-fg); margin-top: 2px; }

#campaignFilters { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; padding: 8px 12px; }
.filter-btn {
  font-size: 12px; padding: 4px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: white; cursor: pointer;
}
.filter-btn:hover { background: #F3F4F6; }
.filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
#campaignSearch {
  flex: 1; max-width: 280px; padding: 4px 8px; font-size: 12px;
  border: 1px solid var(--border); border-radius: 6px;
}

.campaign-card {
  display: flex; gap: 12px;
  border-left: 4px solid var(--border);
  padding: 12px 14px; margin-bottom: 8px;
  background: var(--card-bg); border-radius: var(--radius-card);
  border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.campaign-card.eliminate { border-left-color: #DC2626; }
.campaign-card.adjust    { border-left-color: #F59E0B; }
.campaign-card.keep      { border-left-color: #16A34A; }

.campaign-card .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.campaign-card .meta { font-size: 12px; color: var(--muted-fg); margin-top: 4px; }
.campaign-card .values {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px;
  margin-top: 8px; font-size: 13px;
}
.campaign-card .reason {
  font-size: 12px; line-height: 1.55; color: var(--foreground);
  margin-top: 8px; white-space: pre-wrap;
}
.campaign-card .detail { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
.campaign-card .detail.hidden { display: none; }
.campaign-card .badge {
  font-size: 10px; padding: 2px 8px; border-radius: 9999px; font-weight: 600;
}
.badge-eliminate { background: #FEE2E2; color: #991B1B; }
.badge-adjust    { background: #FEF3C7; color: #92400E; }
.badge-keep      { background: #DCFCE7; color: #166534; }
.badge-skipped   { background: #E5E7EB; color: #6B7280; }
.badge-high      { background: #DBEAFE; color: #1E40AF; }
.badge-medium    { background: #E5E7EB; color: #374151; }
.badge-low       { background: #FCE7F3; color: #9D174D; }

/* ─── synthesis 叙事卡 ─── */
.synthesis-group {
  border-left: 3px solid var(--primary);
  padding: 8px 12px; margin-bottom: 10px; background: #F9FAFB;
  border-radius: 0 6px 6px 0;
}
.synthesis-group .group-title {
  font-size: 13px; font-weight: 600; color: var(--foreground); margin-bottom: 4px;
}
.synthesis-group .group-narrative {
  font-size: 12px; color: var(--foreground); line-height: 1.6; margin-bottom: 4px;
}
.synthesis-group .group-keys {
  font-size: 11px; color: var(--muted-fg);
}
.synthesis-group .group-keys details summary { cursor: pointer; user-select: none; }
.synthesis-group .group-keys ul { margin: 4px 0 0 0; padding-left: 18px; }
.synthesis-special {
  border-left: 3px solid #F59E0B; padding: 8px 12px; margin-top: 8px;
  background: #FFFBEB; border-radius: 0 6px 6px 0;
}

/* ─── batch toolbar + checkbox + 角标 ─── */
.batch-toolbar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 8px 12px; margin-bottom: 8px;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-card);
}
.batch-toolbar .sep { flex: 1; }
.batch-toolbar button {
  font-size: 12px; padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: white; cursor: pointer;
}
.batch-toolbar button:hover { background: #F3F4F6; }
.batch-toolbar button.primary {
  background: var(--primary); color: white; border-color: var(--primary);
}
.batch-toolbar button.danger {
  background: #DC2626; color: white; border-color: #DC2626;
}
.campaign-card .card-checkbox {
  flex: 0 0 auto; padding-top: 2px;
}
.campaign-card .review-badge {
  position: absolute; top: 8px; right: 12px;
  font-size: 10px; padding: 2px 8px; border-radius: 9999px; font-weight: 600;
}
.campaign-card { position: relative; }
.review-approve { background: #DCFCE7; color: #166534; }
.review-reject  { background: #FEE2E2; color: #991B1B; }
.campaign-card.skipped {
  border-left-color: #9CA3AF; opacity: 0.85; background: #F9FAFB;
}

/* ─── 多维筛选下拉 ─── */
#campaignFilters {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
#campaignFilters .filter-group {
  display: flex; align-items: center; gap: 4px;
}
#campaignFilters .filter-label {
  font-size: 11px; color: var(--muted-fg);
}
#campaignFilters select {
  width: auto; padding: 4px 8px; font-size: 12px;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">
    Campaign 活动分析 <span class="topbar-badge">DEBUG</span>
  </div>
  <div class="topbar-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">检测中…</span>
  </div>
</div>

<div class="app-layout">
  <!-- ═══════════════ 左侧 ═══════════════ -->
  <aside class="sidebar">

    <!-- ASIN 输入 -->
    <div class="card">
      <div class="card-title">ASIN 输入</div>
      <label>父 ASIN</label>
      <input id="asinInput" placeholder="如 B0B7S3PWWB" value="B0B7S3PWWB">
      <div style="display:flex; gap:8px; margin-top:8px;">
        <div style="flex:1;">
          <label>窗口</label>
          <select id="daysSelect">
            <option value="7" selected>7 天</option>
            <option value="14">14 天</option>
            <option value="30">30 天</option>
          </select>
        </div>
        <div style="flex:1; display:flex; align-items:flex-end;">
          <button class="btn btn-primary btn-block" onclick="loadContext()">加载状态</button>
        </div>
      </div>
    </div>

    <!-- 当前状态（只读，来自共享后端）-->
    <div class="card" id="cardContext">
      <div class="card-title">当前状态（只读）</div>
      <div id="contextBody">
        <div class="muted text-xs">请先「加载状态」</div>
      </div>
      <div class="text-xs muted" style="margin-top:8px; border-top:1px dashed var(--border); padding-top:6px;">
        如需修改战略/策略/目标 ACOS，请去主应用
        <a href="/demo/ad-asisitant-agent.html" target="_blank" style="color:var(--primary);">ad-asisitant-agent.html</a>
        设置；本页只读取并展示。
      </div>
    </div>

    <!-- 活动分析触发 -->
    <div class="card">
      <div class="card-title">★ 活动分析触发</div>
      <label>LLM 温度</label>
      <select id="campaignTemp">
        <option value="0">0 (确定性)</option>
        <option value="0.3" selected>0.3 (默认)</option>
        <option value="0.7">0.7 (发散)</option>
      </select>
      <button id="btnCampaignAnalyze" class="btn btn-primary btn-block" style="margin-top:10px;"
              onclick="runCampaignAnalysis()">运行活动分析</button>
      <div class="text-xs muted" style="margin-top:6px;">
        全流程约 15~30 分钟（视父 ASIN 活动数量而定），期间可继续浏览。
      </div>
    </div>

  </aside>

  <!-- ═══════════════ 右侧主面板 ═══════════════ -->
  <main class="main-area">

    <div class="card hidden" id="campaignSummary">
      <div class="card-title">分析概览</div>
      <div class="campaign-summary">
        <div class="stat"><div class="num" id="sumTotal">-</div><div class="lab">活动总数</div></div>
        <div class="stat"><div class="num" id="sumElim" style="color:#DC2626;">-</div><div class="lab">淘汰</div></div>
        <div class="stat"><div class="num" id="sumAdj" style="color:#F59E0B;">-</div><div class="lab">调整</div></div>
        <div class="stat"><div class="num" id="sumKeep" style="color:#16A34A;">-</div><div class="lab">保持</div></div>
      </div>
      <div class="text-sm muted" id="sumMeta" style="margin-top:8px;"></div>
      <div class="text-sm" style="color:#DC2626; margin-top:6px; cursor:help;" id="sumWarnings"></div>
    </div>

    <!-- AI 汇总叙事卡 -->
    <div class="card hidden" id="campaignSynthesis">
      <div class="card-title">AI 汇总分析（按共同原因分组）</div>
      <div id="synthesisBody"></div>
    </div>

    <!-- 多维筛选 + 搜索 -->
    <div class="card hidden" id="campaignFilters">
      <div class="filter-group">
        <span class="filter-label">动作</span>
        <select id="filterAction">
          <option value="all" selected>全部</option>
          <option value="eliminate">淘汰</option>
          <option value="adjust">调整</option>
          <option value="keep">保持</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">分析状态</span>
        <select id="filterStatus">
          <option value="all" selected>全部</option>
          <option value="ok">已分析</option>
          <option value="skipped">丢失</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">匹配类型</span>
        <select id="filterMatch">
          <option value="all" selected>全部</option>
          <option value="exact">精准</option>
          <option value="broad">广泛</option>
        </select>
      </div>
      <input id="campaignSearch" placeholder="搜索活动名 / 关键词" style="flex:1; max-width:280px;">
    </div>

    <!-- 批量审核工具条 -->
    <div class="batch-toolbar hidden" id="batchToolbar">
      <button onclick="selectAllVisible()">全选可见</button>
      <button onclick="clearSelection()">清空选择</button>
      <span class="text-xs muted">已选 <strong id="selectionCount">0</strong></span>
      <span class="sep"></span>
      <button class="primary" onclick="batchConfirm('approve')">同意所选</button>
      <button class="danger" onclick="batchConfirm('reject')">不同意所选</button>
      <button onclick="exportReview()">导出审核 JSON</button>
    </div>

    <div id="campaignList"></div>

    <div id="campaignLoader" class="hidden" style="text-align:center; padding:60px 20px;">
      <span class="spinner"></span>
      <div style="margin-top:12px; color:var(--muted-fg);">正在分析广告活动，预计 15~30 分钟…</div>
      <div class="text-xs muted" style="margin-top:6px;">后端流程：拉数据 → 分批（精准/广泛并行）→ AI 分析 → 交叉校验 → 汇总合成</div>
    </div>

  </main>
</div>

<script>
// ═══════════════ 全局 ═══════════════
const API = window.location.origin + '/api/v1/agent/ad-direction';
const API_TIMEOUT = {
  default: 30,
  context: 60,        // 加载状态
  campaign: 1800,     // 活动分析最重，30 分钟
};

let asin = '';
let days = 7;
let _campaignItems = [];          // adjustments + skipped (统一渲染源)
let _currentRunId = '';
let _reviewState = {};            // {campaign_key: 'approve' | 'reject'}
let _selection = new Set();       // 当前选中的 campaign_keys

// localStorage helpers (key 含 run_id，自动隔离不同次分析)
function _reviewStorageKey(asin, days, runId) {
  return 'campaign_review_' + asin + '_' + days + '_' + (runId || 'unknown');
}
function _loadReviewState(asin, days, runId) {
  try {
    const raw = localStorage.getItem(_reviewStorageKey(asin, days, runId));
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function _saveReviewState(asin, days, runId, state) {
  try {
    localStorage.setItem(_reviewStorageKey(asin, days, runId), JSON.stringify(state));
  } catch (e) { console.warn('localStorage 写入失败', e); }
}
// 启动时清理 7 天前的旧 key (轻量 GC)
function _gcOldReviewKeys() {
  try {
    const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
    const toDel = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith('campaign_review_')) continue;
      // key 末段是 run_id 形如 20260601T123456Z
      const m = k.match(/_(\d{8})T(\d{6})Z$/);
      if (!m) continue;
      const t = Date.UTC(
        +m[1].slice(0,4), +m[1].slice(4,6) - 1, +m[1].slice(6,8),
        +m[2].slice(0,2), +m[2].slice(2,4), +m[2].slice(4,6),
      );
      if (t < cutoff) toDel.push(k);
    }
    toDel.forEach(k => localStorage.removeItem(k));
  } catch {}
}
_gcOldReviewKeys();

// ═══════════════ 工具 ═══════════════
function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function escapeHTML(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtMoney(v) {
  if (v == null) return '—';
  return Number(v).toFixed(2);
}
function fmtChange(cur, prop) {
  if (prop == null) return '<span class="muted">— (保持)</span>';
  if (cur == null) return '$' + fmtMoney(prop);
  const d = prop - cur;
  if (Math.abs(d) < 0.005) return '$' + fmtMoney(prop) + ' <span class="text-xs muted">(持平)</span>';
  const sign = d > 0 ? '+' : '';
  const color = d > 0 ? '#16A34A' : '#DC2626';
  return `$${fmtMoney(prop)} <span style="color:${color}; font-size:11px;">(${sign}$${d.toFixed(2)})</span>`;
}

async function callAPI(path, body, timeout = API_TIMEOUT.default, method = 'POST') {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout * 1000);
  try {
    const opts = { method, headers: {'Content-Type': 'application/json'}, signal: ctrl.signal };
    if (body != null) opts.body = JSON.stringify(body);
    const r = await fetch(`${API}${path}`, opts);
    if (!r.ok) {
      const txt = await r.text();
      throw new Error(`HTTP ${r.status}: ${txt.slice(0, 300)}`);
    }
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') {
      throw new Error(`请求超时（${timeout} 秒）`);
    }
    if (e instanceof TypeError) {
      throw new Error('无法连接后端：请通过 http://<host>/demo/campaign_test.html 访问（不要 file://）');
    }
    throw e;
  } finally {
    clearTimeout(t);
  }
}

// ═══════════════ 服务检测 ═══════════════
(async () => {
  try {
    const r = await fetch(window.location.origin + '/health', { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      $('statusDot').classList.add('online');
      $('statusText').textContent = '后端在线';
    } else {
      $('statusText').textContent = '后端异常';
    }
  } catch {
    $('statusText').textContent = '无法连接';
  }
})();

// ═══════════════ 加载状态（只读）═══════════════
async function loadContext() {
  asin = ($('asinInput').value || '').trim().toUpperCase();
  days = parseInt($('daysSelect').value);
  if (!asin) { alert('请输入 ASIN'); return; }

  $('contextBody').innerHTML = '<div class="muted text-xs"><span class="spinner"></span> 加载中…</div>';

  try {
    // wizard/state 纯 DB 读，毫秒级；未确认字段显示"未设置"
    const wf = await callAPI('/wizard/state/' + encodeURIComponent(asin), null, 5, 'GET');
    renderContext(wf);
  } catch (e) {
    $('contextBody').innerHTML = `<div class="text-xs" style="color:#DC2626;">加载失败: ${escapeHTML(e.message)}</div>`;
  }
}

function renderContext(wf) {
  const s = (wf && wf.strategy) || {};
  const t = (wf && wf.tactics)  || {};

  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v ${v ? '' : 'empty'}">${v || '未设置'}</span></div>`;

  $('contextBody').innerHTML = [
    kv('产品定位', s.product_level),
    kv('产品阶段', s.product_stage),
    kv('淡旺季',   s.season_stage),
    kv('广告目的', (t.ad_purposes || []).join('、')),
    kv('关键词类型', (t.target_keyword_strategy || []).join('、')),
  ].join('');
}

// ═══════════════ 活动分析 ═══════════════
async function runCampaignAnalysis() {
  if (!asin) {
    asin = ($('asinInput').value || '').trim().toUpperCase();
    days = parseInt($('daysSelect').value);
  }
  if (!asin) { alert('请先输入 ASIN'); return; }

  const temp = parseFloat($('campaignTemp').value);

  $('btnCampaignAnalyze').disabled = true;
  show('campaignLoader');
  hide('campaignSummary'); hide('campaignFilters');
  hide('campaignSynthesis'); hide('batchToolbar');
  $('campaignList').innerHTML = '';

  try {
    const result = await callAPI(
      '/campaign/analyze',
      { asin, days, temperature: temp },
      API_TIMEOUT.campaign,
    );
    renderResult(result);
  } catch (e) {
    $('campaignList').innerHTML =
      `<div class="card" style="color:#DC2626; padding:20px;">分析失败：${escapeHTML(e.message)}</div>`;
  } finally {
    hide('campaignLoader');
    $('btnCampaignAnalyze').disabled = false;
  }
}

function renderResult(r) {
  _currentRunId = r.run_id || '';

  // 合并 adjustments + skipped 占位项（标 __skipped: true）
  const skipped = (r.skipped_campaigns || []).map(s => Object.assign({}, s, {
    __skipped: true, action: 'skipped', confidence: 'low', reason: s.reason || '未被分析',
  }));
  _campaignItems = (r.adjustments || []).concat(skipped);

  // 恢复审核态（按当前 run_id 隔离）
  _reviewState = _loadReviewState(asin, days, _currentRunId);
  _selection.clear();

  // 概览统计
  const s = r.summary || {};
  $('sumTotal').textContent = r.total_campaigns ?? '-';
  $('sumElim').textContent  = s.to_eliminate ?? 0;
  $('sumAdj').textContent   = s.to_adjust ?? 0;
  $('sumKeep').textContent  = s.to_keep ?? 0;

  const conf = `高 ${s.confidence_high||0} / 中 ${s.confidence_medium||0} / 低 ${s.confidence_low||0}`;
  const budget = s.estimated_budget_impact ?? 0;
  const budgetStr = budget >= 0 ? `+$${budget.toFixed(2)}` : `-$${Math.abs(budget).toFixed(2)}`;
  const sanity = r.sanity_check_passed ? '✓' : '✗';
  const skippedNote = skipped.length ? `  |  丢失: ${skipped.length}` : '';
  $('sumMeta').textContent =
    `置信: ${conf}  |  预算影响: ${budgetStr}  |  校验: ${sanity}${skippedNote}`;

  const warns = r.warnings || [];
  if (warns.length) {
    $('sumWarnings').textContent = `⚠ ${warns.length} 条警告（鼠标悬停查看全部）`;
    $('sumWarnings').title = warns.join('\n');
  } else {
    $('sumWarnings').textContent = '';
  }

  // AI 汇总叙事
  renderSynthesis(r.synthesis);

  show('campaignSummary');
  show('campaignFilters');
  show('batchToolbar');
  bindFilterEvents();
  applyFilters();
  updateSelectionCount();
}

function renderSynthesis(synthesis) {
  if (!synthesis) {
    $('synthesisBody').innerHTML = '<div class="text-xs muted">AI 汇总临时禁用（synthesis=null），请查看下方明细清单。</div>';
    show('campaignSynthesis');
    return;
  }
  const groups = synthesis.groups || [];
  const specials = synthesis.special_cases || [];

  if (!groups.length && !specials.length) {
    $('synthesisBody').innerHTML = '<div class="text-xs muted">AI 未产出汇总分组，请查看下方明细清单。</div>';
    show('campaignSynthesis');
    return;
  }

  const groupsHtml = groups.map((g, i) => `
    <div class="synthesis-group">
      <div class="group-title">${i + 1}. ${escapeHTML(g.title || '(无标题)')}
        <span class="badge badge-${g.action === 'eliminate_to_low_bid_pool' ? 'eliminate' : (g.action || '').startsWith('adjust') ? 'adjust' : 'keep'}" style="margin-left:6px;">
          ${actionLabel(g.action)} · ${g.count ?? (g.campaign_keys || []).length}
        </span>
      </div>
      <div class="group-narrative">${escapeHTML(g.narrative || '')}</div>
      <div class="group-keys">
        <details>
          <summary>查看成员活动 (${(g.campaign_keys || []).length})</summary>
          <ul>${(g.campaign_keys || []).map(k => `<li>${escapeHTML(k)}</li>`).join('')}</ul>
        </details>
      </div>
    </div>
  `).join('');

  const specialsHtml = specials.length ? `
    <div class="synthesis-special">
      <div class="group-title">特殊调整 (${specials.length})</div>
      <ul style="margin:4px 0 0 0; padding-left:18px; font-size:12px;">
        ${specials.map(sc => `<li><strong>${escapeHTML(sc.campaign_key || '?')}</strong>：${escapeHTML(sc.why_special || '')}</li>`).join('')}
      </ul>
    </div>` : '';

  $('synthesisBody').innerHTML = groupsHtml + specialsHtml;
  show('campaignSynthesis');
}

function bindFilterEvents() {
  ['filterAction', 'filterStatus', 'filterMatch'].forEach(id => {
    $(id).onchange = applyFilters;
  });
  $('campaignSearch').oninput = applyFilters;
}

function applyFilters() {
  const fAction = $('filterAction').value;
  const fStatus = $('filterStatus').value;
  const fMatch  = $('filterMatch').value;
  const q = ($('campaignSearch').value || '').toLowerCase().trim();

  let items = _campaignItems.filter(a => {
    // 状态维度
    const isSkipped = !!a.__skipped;
    if (fStatus === 'ok' && isSkipped) return false;
    if (fStatus === 'skipped' && !isSkipped) return false;
    // 动作维度（skipped 视为不参与动作筛选，除非选了"全部"）
    if (fAction !== 'all' && !isSkipped) {
      if (fAction === 'eliminate' && a.action !== 'eliminate_to_low_bid_pool') return false;
      if (fAction === 'adjust' && !(a.action || '').startsWith('adjust')) return false;
      if (fAction === 'keep' && a.action !== 'keep') return false;
    }
    if (fAction !== 'all' && isSkipped) return false;
    // 匹配类型维度
    if (fMatch === 'exact' && a.match_type !== 'EXACT') return false;
    if (fMatch === 'broad' && a.match_type === 'EXACT') return false;
    // 搜索
    if (q) {
      const hay = ((a.campaign_name || '') + ' ' + (a.keyword_text || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  renderCards(items);
}

function actionLabel(a) {
  return ({
    eliminate_to_low_bid_pool: '淘汰',
    adjust_bid: '调出价',
    adjust_budget: '调预算',
    adjust_placement: '调广告位',
    keep: '保持',
  }[a] || a || '?');
}

function renderCards(items) {
  if (!items.length) {
    $('campaignList').innerHTML =
      '<div class="card" style="text-align:center; color:var(--muted-fg); padding:30px;">无匹配活动</div>';
    return;
  }
  $('campaignList').innerHTML = items.map(adj => {
    // 丢失活动 占位卡（无 LLM 输出，只显示原信息 + 警示）
    if (adj.__skipped) {
      return `
        <div class="campaign-card skipped">
          <div class="card-checkbox">
            <input type="checkbox" disabled title="丢失活动无法审核">
          </div>
          <div style="flex:1; min-width:0;">
            <div class="head">
              <span class="badge badge-skipped">丢失</span>
              <strong style="word-break:break-all;">${escapeHTML(adj.campaign_name || '?')}</strong>
            </div>
            <div class="meta">
              × ${escapeHTML(adj.child_asin || '?')}
              | ${escapeHTML(adj.match_type || '?')}
              | 关键词: ${escapeHTML(adj.keyword_text || '?')}
            </div>
            <div class="text-sm" style="color:#DC2626; margin-top:6px;">
              ⚠ ${escapeHTML(adj.reason || '未被分析')}
            </div>
          </div>
        </div>`;
    }

    const klass = adj.action === 'eliminate_to_low_bid_pool' ? 'eliminate'
                 : (adj.action || '').startsWith('adjust') ? 'adjust' : 'keep';
    const confKlass = adj.confidence === 'high' ? 'high'
                    : adj.confidence === 'low' ? 'low' : 'medium';

    const fullReason = adj.reason || '';
    const shortReason = fullReason.length > 250 ? fullReason.slice(0, 250) + '…' : fullReason;
    const reviewMark = _reviewState[adj.campaign_key];
    const reviewBadge = reviewMark
      ? `<span class="review-badge review-${reviewMark}">${reviewMark === 'approve' ? '✓ 已同意' : '✗ 已拒绝'}</span>`
      : '';
    const checked = _selection.has(adj.campaign_key) ? 'checked' : '';

    return `
      <div class="campaign-card ${klass}">
        <div class="card-checkbox">
          <input type="checkbox" data-key="${escapeHTML(adj.campaign_key || '')}"
                 ${checked} onchange="toggleSelection(this)">
        </div>
        <div style="flex:1; min-width:0;">
          ${reviewBadge}
          <div class="head">
            <span class="badge badge-${klass}">${actionLabel(adj.action)}</span>
            <span class="badge badge-${confKlass}">${escapeHTML(adj.confidence || 'medium')}</span>
            <strong style="word-break:break-all;">${escapeHTML(adj.campaign_name || '?')}</strong>
          </div>
          <div class="meta">
            × ${escapeHTML(adj.child_asin || '?')}
            | ${escapeHTML(adj.match_type || '?')}
            | 关键词: ${escapeHTML(adj.keyword_text || '?')}
            ${adj.keyword_class ? '| ' + escapeHTML(adj.keyword_class) : ''}
            ${adj.is_core ? '| <span style="color:#DC2626;">⚠ 核心词</span>' : ''}
            ${adj.triggered_rule ? '| 触发规则: <code>' + escapeHTML(adj.triggered_rule) + '</code>' : ''}
          </div>
          <div class="values">
            <div>Bid: $${fmtMoney(adj.current_bid)} → ${fmtChange(adj.current_bid, adj.proposed_bid)}</div>
            <div>Budget: $${fmtMoney(adj.current_budget)} → ${fmtChange(adj.current_budget, adj.proposed_budget)}</div>
          </div>
          <div class="reason">${escapeHTML(shortReason)}</div>
          <div class="detail hidden">
            ${renderEvidence(adj)}
            ${renderPlacements(adj)}
            ${renderNegKeywords(adj)}
            ${fullReason.length > 250 ? `<div class="text-xs" style="margin-top:8px;"><strong>完整理由:</strong><div class="reason" style="margin-top:4px;">${escapeHTML(fullReason)}</div></div>` : ''}
            <div class="text-xs muted" style="margin-top:8px;">
              审核等级: ${escapeHTML(adj.review_level || 'MANUAL_REVIEW')}
            </div>
          </div>
          <button class="btn btn-ghost" style="font-size:11px; padding:2px 10px; margin-top:6px;"
                  onclick="toggleDetail(this)">展开详情</button>
        </div>
      </div>
    `;
  }).join('');
}

// ═══════════════ 批量审核 ═══════════════
function toggleSelection(checkbox) {
  const key = checkbox.dataset.key;
  if (!key) return;
  if (checkbox.checked) _selection.add(key);
  else _selection.delete(key);
  updateSelectionCount();
}

function updateSelectionCount() {
  const el = $('selectionCount');
  if (el) el.textContent = _selection.size;
}

function _visibleNonSkippedKeys() {
  const keys = [];
  document.querySelectorAll('#campaignList .campaign-card:not(.skipped) input[type="checkbox"]').forEach(cb => {
    if (cb.dataset.key) keys.push(cb.dataset.key);
  });
  return keys;
}

function selectAllVisible() {
  _visibleNonSkippedKeys().forEach(k => _selection.add(k));
  applyFilters();
  updateSelectionCount();
}

function clearSelection() {
  _selection.clear();
  applyFilters();
  updateSelectionCount();
}

async function batchConfirm(decision) {
  if (!_selection.size) { alert('请先勾选活动'); return; }
  const keys = Array.from(_selection);
  if (!confirm(`确认对 ${keys.length} 个活动执行「${decision === 'approve' ? '同意' : '不同意'}」？`)) return;

  // 更新本地审核态
  keys.forEach(k => { _reviewState[k] = decision; });
  _saveReviewState(asin, days, _currentRunId, _reviewState);

  // 调后端 stub
  const payload = {
    asin, days, run_id: _currentRunId,
    decisions: keys.map(k => ({ campaign_key: k, decision, note: '' })),
    operator: '',
  };
  try {
    const resp = await callAPI('/campaign/confirm', payload, 15);
    alert(`后端已接收 ${resp.received} 条决定（approve=${resp.approve}, reject=${resp.reject}）\n${resp.note || ''}`);
  } catch (e) {
    alert('提交失败（本地审核态已保存，可重试或导出）：' + e.message);
  }

  _selection.clear();
  applyFilters();
  updateSelectionCount();
}

function exportReview() {
  const decisions = Object.entries(_reviewState).map(([campaign_key, decision]) => ({
    campaign_key, decision, note: '',
  }));
  if (!decisions.length) { alert('当前没有审核记录'); return; }
  const payload = {
    asin, days, run_id: _currentRunId, exported_at: new Date().toISOString(),
    decisions,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `campaign_review_${asin}_${_currentRunId || 'unknown'}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderEvidence(adj) {
  const ev = adj.evidence || [];
  if (!ev.length) return '';
  return `<div class="text-sm" style="margin-top:6px;">
    <strong>证据:</strong>
    <ul style="margin:4px 0; padding-left:18px;">
      ${ev.map(e => `<li>${escapeHTML(e)}</li>`).join('')}
    </ul>
  </div>`;
}

function renderPlacements(adj) {
  const pl = adj.placement_adjustments || [];
  if (!pl.length) return '';
  return `<div class="text-sm" style="margin-top:6px;">
    <strong>广告位调整:</strong>
    <div style="margin-left:12px;">
    ${pl.map(p => `<div>
      ${escapeHTML(p.placement || '?')}: ${p.current_pct ?? 0}% → ${p.proposed_pct ?? 0}%
      ${p.action ? ' <span class="muted">(' + escapeHTML(p.action) + ')</span>' : ''}
      ${p.evidence ? ' — <span class="text-xs muted">' + escapeHTML(p.evidence) + '</span>' : ''}
    </div>`).join('')}
    </div>
  </div>`;
}

function renderNegKeywords(adj) {
  const nk = adj.negative_keywords || [];
  if (!nk.length) return '';
  // vote=optional 为「可选否词」(仅单轮命中)，其余视为「推荐否词」(两轮一致或单轮直出)
  const rec = nk.filter(n => n.vote !== 'optional');
  const opt = nk.filter(n => n.vote === 'optional');
  const row = n => `<div>
    ${escapeHTML(n.keyword || '?')}
    <span class="text-xs muted">
      (花费$${n.spend_7d ?? n.cost ?? '?'}, 点击${n.clicks_7d ?? n.clicks ?? '?'}, 订单${n.orders_7d ?? n.orders ?? 0})
    </span>
    ${n.reason ? ' — ' + escapeHTML(n.reason) : ''}
  </div>`;
  let body = '';
  if (rec.length) body += `<div class="text-xs" style="color:#166534; margin-top:2px;">推荐否词（两轮一致 ${rec.length}）</div>${rec.map(row).join('')}`;
  if (opt.length) body += `<div class="text-xs muted" style="margin-top:4px;">可选否词（仅单轮建议 ${opt.length}）</div>${opt.map(row).join('')}`;
  return `<div class="text-sm" style="margin-top:6px;">
    <strong>否定词建议:</strong>
    <div style="margin-left:12px;">${body}</div>
  </div>`;
}

function toggleDetail(btn) {
  const detail = btn.previousElementSibling;
  detail.classList.toggle('hidden');
  btn.textContent = detail.classList.contains('hidden') ? '展开详情' : '收起详情';
}
</script>
</body>
</html>
