# 四层工作流 — 选项定义
# Layer 1.1 ~ 1.4 所有维度选项、描述、约束

[strategy.product_level]
label = "产品定位"
description = "根据产品在店铺中的战略地位划分，决定广告投入力度"
selection_type = "radio"
[[strategy.product_level.options]]
id = "战略级产品 (P0)"
label = "战略级产品 (P0)"
description = "全年核心主推或旺季爆款。准入：月订单≥3000 + BSR Top50 + 评≥4.0 + 退货率≤25% + 库存≥30天"

[[strategy.product_level.options]]
id = "重点产品 (P1)"
label = "重点产品 (P1)"
description = "市场已验证，有机会推成主力款。P2→P1需满足任意3条：日均订单≥50 / 环比≥20% / 自然单>30% / 核心词Top50 / 退货率≤30%"

[[strategy.product_level.options]]
id = "常规产品 (P2)"
label = "常规产品 (P2)"
description = "稳定出单、控制成本、保护利润（兜底类型）"

[[strategy.product_level.options]]
id = "长尾产品 (P3)"
label = "长尾产品 (P3)"
description = "高毛利、小众或风格化，不追大词排名，ACOS通常≤30%"

[strategy.product_stage]
label = "产品阶段"
description = "产品生命周期阶段，影响广告目标和预算分配策略"
selection_type = "radio"
[[strategy.product_stage.options]]
id = "测试期"
label = "测试期"
description = "新品测试或起步验证阶段，验证市场需求和Listing质量，不宜大规模投入"

[[strategy.product_stage.options]]
id = "推进期"
label = "推进期"
description = "增长推进期，需要快速起量、推排名、抢占市场份额"

[[strategy.product_stage.options]]
id = "收割利润期"
label = "收割利润期"
description = "达成预期目标，重点控制利润和ACOS，追求盈利最大化"

[[strategy.product_stage.options]]
id = "维持期"
label = "维持期"
description = "超预期表现，维持当前稳定状态，精细化调控"

[[strategy.product_stage.options]]
id = "清货期"
label = "清货期"
description = "库存清理阶段，放宽ACOS限制，优先清仓止损"

[strategy.season_stage]
label = "淡旺季阶段"
description = "当前所处的季节性时段，影响广告投放节奏和出价策略"
selection_type = "radio"
[[strategy.season_stage.options]]
id = "淡季"
label = "淡季"
description = "类目搜索量处于低位，控制预算等待旺季"

[[strategy.season_stage.options]]
id = "旺季准备"
label = "旺季准备"
description = "旺季前1-2周，需要提前布局关键词排名和流量卡位"

[[strategy.season_stage.options]]
id = "大旺季"
label = "大旺季"
description = "流量和转化高峰期，最大化投入抢占市场份额"

[[strategy.season_stage.options]]
id = "旺季末期"
label = "旺季末期"
description = "旺季尾声，逐步缩减预算，防止库存积压"

# ── Layer 1.2 策略层 ─────────────────────────────────────

[tactics.ad_purposes]
label = "广告目的"
description = "当前广告投放的核心目标，可多选"
selection_type = "multi_select"
[[tactics.ad_purposes.options]]
id = "引流型"
label = "引流型"
description = "以获取曝光和点击为主要目标，适合新品/冷启动阶段"

[[tactics.ad_purposes.options]]
id = "转化型"
label = "转化型"
description = "以获取订单和提升转化率为主要目标，适合有基础数据的产品"

[[tactics.ad_purposes.options]]
id = "排名型"
label = "排名型"
description = "以提升关键词自然排名为主要目标，适合推进期产品"

[[tactics.ad_purposes.options]]
id = "盈利型"
label = "盈利型"
description = "以控制ACOS和利润最大化为主要目标，适合达成期/超预期产品"

[tactics.target_keyword_strategy]
label = "目标关键词类型"
description = "广告投放的关键词类型选择，受广告目的影响"
selection_type = "multi_select"
[[tactics.target_keyword_strategy.options]]
id = "大词"
label = "大词"
description = "高流量泛词/类目词，CPC高竞争激烈，适合引流和品牌曝光"

[[tactics.target_keyword_strategy.options]]
id = "长尾词"
label = "长尾词"
description = "精准长尾搜索词，CPC低转化率高，适合转化和ACOS优化"

[[tactics.target_keyword_strategy.options]]
id = "竞品词"
label = "竞品词"
description = "直接竞品反查得出的关键词，初始中低 Bid 测试"

[[tactics.target_keyword_strategy.options]]
id = "品牌词"
label = "品牌词"
description = "借品牌流量做平替转化，小比例补充策略"

[[tactics.target_keyword_strategy.options]]
id = "自定义"
label = "自定义"
description = "运营经验词/节日词/趋势词"

# ── Layer 1.4 执行层 ─────────────────────────────────────

[execution.directions]
[[execution.directions.options]]
id = "push_natural"
label = "推进自然位"
description = "倾斜预算推核心词自然排名，扩大自然流量占比"

[[execution.directions.options]]
id = "expand_keywords"
label = "新增扩词"
description = "拓展关键词覆盖，发现高转化潜力新词并投放"

[[execution.directions.options]]
id = "optimize_acos"
label = "优化ACOS"
description = "清理高花费低效词，降低整体ACOS提升广告效率"

[[execution.directions.options]]
id = "balance_maintain"
label = "平衡维持"
description = "保持当前投放策略，微调参数维持稳定表现"
