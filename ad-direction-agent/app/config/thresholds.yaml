# 规则阈值配置 — 所有规则的可调参数
# 修改此文件即可调整规则判定标准，无需改代码

# 通用阈值
general:
  data_timeout_seconds: 5
  max_retries: 2

# 推进自然位 (push_natural) 规则阈值
push_natural:
  pn_1:
    description: "检查是否有上升词可关注"
    min_rising_keywords: 2          # 至少 N 个词在上升才能推自然位
    rising_rank_threshold: 5        # 上升超过 N 位才算 "上升词"
  pn_2:
    description: "预算倾斜比例合理性"
    max_budget_ratio: 50            # 预算倾斜不得超过此比例
  pn_3:
    description: "检查 TOS 花费占比是否可提升"
    max_tos_ratio: 40               # TOS 占比低于此值才有上升空间
  pn_4:
    description: "检查上升词的 ACOS 是否可接受"
    max_acos_for_rising: 35         # 上升词 ACOS 在此值以下才值得加预算
  pn_5:
    description: "检查核心词自然位是否还有上升空间"
    min_current_rank: 5             # 核心词自然位 > N（还没进首页前列）才有空间

# 新增扩词 (expand_keywords) 规则阈值
expand_keywords:
  ke_1:
    description: "检查是否有新词可扩（搜索词报告未收录词）"
    min_qualified_keywords: 2       # 至少 N 个合格未收录词才建议扩词
    max_acos_for_new: 30            # 新词 ACOS 上限
  ke_2:
    description: "检查当前关键词覆盖率"
    max_keyword_count: 10           # 当前词数低于此值说明覆盖率偏低
  ke_3:
    description: "检查现有词 ACOS 是否健康"
    acos_threshold_factor: 1.2      # 现有词 ACOS < 目标 × 此因子
  ke_4:
    description: "检查单次新增数量是否合理"
    recommended_new_count: 5        # 建议每次新增词数
    max_new_count: 15               # 单次新增上限

# 优化 ACOS (optimize_acos) 规则阈值
optimize_acos:
  oa_1:
    description: "检查是否有 ACOS 超标词"
    acos_warning_threshold: 30      # ACOS 高于此值需关注
    acos_force_threshold: 50        # ACOS 高于此值强制修正
  oa_2:
    description: "检查有无高花费零转化词"
    high_spend_zero_convert_threshold: 15  # 花费高于此值且 0 转化需处理
  oa_3:
    description: "检查是否有 Bid 调整空间"
    bid_reduction_headroom: 0.8     # 当前 Bid > 建议 Bid × 此值才有下调空间
  oa_4:
    description: "检查否定词机会"
    min_impressions_for_negative: 500   # 展示量高于此值才考虑否定

# 平衡维持 (balance_maintain) 规则阈值
balance_maintain:
  bm_1:
    description: "检查指标波动是否在容忍范围内"
    acos_fluctuation_tolerance: 15  # ACOS 波动 % 上限
    cvr_fluctuation_tolerance: 15   # CVR 波动 % 上限
    sales_fluctuation_tolerance: 15 # 销量波动 % 上限
  bm_2:
    description: "检查是否有异常信号"
    threat_score_max: 50            # 综合威胁分低于此值算安全
  bm_3:
    description: "检查当前参数是否在合理区间"
    acos_upper_bound_factor: 1.2    # ACOS < 目标 × 此因子为合理
    acos_lower_bound_factor: 0.5    # ACOS > 目标 × 此因子（太低也不正常）
  bm_4:
    description: "检查核心词排名稳定性"
    rank_change_threshold: 5        # 排名变化超过 N 位需要关注
  bm_5:
    description: "检查子选项 ACOS 容忍阈值是否合理"
    min_acos_tolerance: 3           # 最小容忍度
    max_acos_tolerance: 20          # 最大容忍度

# 标签联动约束 (cross_tag) 阈值
cross_tag:
  test_stage_forced_ad_purpose:
    description: "测试期广告目的只能是 引流型 或 排名型"
    disallowed_purposes: ["盈利型"]
  harvest_stage_forced_ad_purpose:
    description: "达成期/超预期推荐广告目的"
    allowed_purposes: ["盈利型", "转化型"]
  clearance_ad_purpose:
    description: "清货期广告目的只能是 盈利"
  broad_keyword_stage:
    description: "Broad 大词需要产品阶段不是测试期"
    disallowed_stages: ["测试期"]
  inventory_warning_directions:
    description: "库存预警时允许的广告方向"
    allowed_directions: ["balance_maintain", "optimize_acos"]
  clearance_urgency_directions:
    description: "清仓急迫时允许的广告目的"
    allowed_ad_purposes: ["盈利型"]
